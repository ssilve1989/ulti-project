catalogMode: prefer
catalogPrune: true
packages:
  - apps/*
  - packages/*
strictDepBuilds: false
allowBuilds:
  "@biomejs/biome": true
  lefthook: true
  "@firebase/util": true
  "@nestjs/core": true
  "@sentry-internal/node-cpu-profiler": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  nestjs-pino: true
  protobufjs: false
  "@sentry/node-cpu-profiler": true
minimumReleaseAge: 7200
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeExclude:
  - typescript
  - "@typescript/*"
  - vitest
  - "@vitest/*"
