name: Fly Deploy and Publish Release To Discord
permissions:
  contents: read
on:
  release:
    types: [published]
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      # The image build (apps/bot/Dockerfile) compiles the bot and, given the
      # sentry_auth build secret, injects Sentry Debug IDs into the shipped dist
      # and uploads the sourcemaps.
      - run: flyctl deploy --remote-only --ha=false --config ./apps/bot/fly.toml --dockerfile ./apps/bot/Dockerfile --build-secret sentry_auth="$SENTRY_AUTH_TOKEN"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  publish-release-to-discord:
    name: Publish Release To Discord
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Run Publish Release
        uses: ssilve1989/github-releases-to-discord-action@52ce4c8c459fea604fed6afb6f5191304ca1df84 # v2.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
